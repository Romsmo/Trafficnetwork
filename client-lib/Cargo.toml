[workspace]
resolver = "2"
members = [
  "core",
  "bindings/c-abi",
  "bindings/wasm",
  "bindings/uniffi",
  "bindings/uniffi-bindgen",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Romsmo/Trafficnetwork"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
