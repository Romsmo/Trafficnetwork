[package]
name = "trafficnetwork-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "trafficnetwork_core"
crate-type = ["rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = "0.3"
# Pinned to the 2.x line, not the just-released 3.0.0 (same-day release as of
# writing) — the from_bytes/sign/verify surface this crate uses has been
# stable across 1.x-3.x, so 2.x gets the same functionality with a much
# longer track record for a security-critical dependency.
ed25519-dalek = "2"
getrandom = "0.4"
base64 = "0.23"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
