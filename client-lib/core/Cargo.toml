[package]
name = "trafficnetwork-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "trafficnetwork_core"
crate-type = ["rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_canonicalizer = "0.3"
# Pinned to the 2.x line, not the just-released 3.0.0 (same-day release as of
# writing) — the from_bytes/sign/verify surface this crate uses has been
# stable across 1.x-3.x, so 2.x gets the same functionality with a much
# longer track record for a security-critical dependency.
ed25519-dalek = "2"
getrandom = "0.4"
base64 = "0.23"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
# default-features off: skips default-tls (native-tls/openssl) in favor of
# rustls (no system OpenSSL dependency), with webpki-roots for bundled
# Mozilla root certs rather than depending on each target platform's own
# cert store. Both are a no-op on wasm32, where reqwest delegates TLS to the
# browser's own fetch() instead. Feature named "rustls-tls" in older
# reqwest releases — renamed to "rustls" as of 0.13 (confirmed against the
# actual available-features list in a CI failure, not assumed).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots"] }
# HttpTransport/Clock (platform/) need dyn-dispatchable async trait methods
# for host-app-supplied implementations — native async-fn-in-trait isn't
# object-safe as of this Rust version, async-trait remains the standard
# workaround (see docs.rs/async-trait).
async-trait = "0.1"
# H3 cells (BSD-3-Clause, pure Rust, also builds for wasm32): the region tiles
# a position maps to — the same cells the server's h3-js computes, checked
# against vectors made with h3-js (api/tiles.rs).
h3o = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
# `storage::IndexedDbStore` (add-on B3): wraps `InMemoryStore` (see its
# `to_snapshot`/`from_snapshot`) and mirrors writes into IndexedDB in the
# background — `rexie` is a futures-based wrapper, not the raw callback-style
# `web-sys` IndexedDB API, so that mirroring code stays ordinary async Rust.
# Chosen over `sqlite-wasm-rs`+`sqlite-wasm-vfs` (real OPFS): both are eight
# days old at the time of this decision (four published versions) and OPFS's
# synchronous file access only works inside a dedicated Worker, which would
# force this binding's whole JS/TS surface into a worker+message-bridge
# architecture — IndexedDB is the user-approved "gleichwertig" alternative
# (the retired status log's B3 note), with none of that.
rexie = "0.6"
# `platform::Sleep`'s wasm32 implementation — a small, focused crate over
# `Window.setTimeout`/`clearTimeout`, not hand-rolled callback/Promise glue.
gloo-timers = { version = "0.4", features = ["futures"] }
# `platform::ws`'s wasm32 implementation (`web_sys::WebSocket`), `Platform::wasm`'s
# async constructor, and the `bindings/wasm` crate's async JS-facing calls.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "WebSocket",
  "MessageEvent",
  "CloseEvent",
  "ErrorEvent",
  "Window",
  "Storage",
  "console",
] }
# The wasm32 `WsConnection`'s onopen/onmessage/onerror/onclose bridge (a
# channel, not `tokio-tungstenite`'s own stream) — `futures-channel` for the
# channel types themselves, `futures-util`'s `StreamExt` for `.next()` on the
# receiving end. Native's own `futures-util` (below) additionally needs
# "sink" for `SinkExt`, which nothing here requires.
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Persistent store (`storage::SqliteStore`), native targets only — a browser
# build brings its own `Store` with the WASM binding (F-C4). `bundled` compiles
# SQLite (with its R*Tree module) into the library, so no system SQLite is
# needed on any platform.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
# Transparent gzip/brotli for downloads (native only — a browser's fetch()
# already does it): the server stores its static packages compressed, and a
# Europe-sized bootstrap is about four times smaller on the wire that way.
reqwest = { version = "0.13", default-features = false, features = ["gzip", "brotli"] }
# `platform::http`'s TLS configuration (add-on B4): reqwest 0.13 verifies
# certificates with the platform's own verifier, which on Android needs a
# Kotlin component wired in by every app — so the transport hands reqwest a
# `rustls::ClientConfig` trusting the bundled Mozilla roots instead (see
# `bundled_roots_tls`). The versions are the ones reqwest and tokio-tungstenite
# already resolve to, so this adds no second TLS stack.
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
webpki-roots = "1"
# `platform::ws`'s native WebSocket transport (add-on B1). `rustls-tls-webpki-roots`
# matches reqwest's own TLS choice above (rustls + bundled Mozilla roots, no
# second TLS stack, no system OpenSSL) — confirmed against the crate's actual
# feature list (crates.io metadata for 0.30.0), not assumed. Default features
# (`connect` + `handshake`) are kept: without a TLS feature `connect_async`
# has no backend for `wss://` at all.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
# For the `StreamExt`/`SinkExt` trait methods (`.next()`/`.send()`) used
# directly on the WebSocket stream — already a transitive dependency of
# tokio-tungstenite, named here because this crate's own code calls them.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# `platform::Sleep`'s native implementation (`TokioSleeper`) — only the `time`
# feature, not a runtime: an ambient one (the host app's, or the C-ABI's own)
# is expected to already be running wherever this is awaited, same as reqwest.
tokio = { version = "1", features = ["time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Only for `examples/measure_bootstrap.rs`: compressed size of what crosses the
# wire, and a process-memory sampler that works on Linux and Windows alike.
flate2 = "1"
memory-stats = "1"

# `storage::indexed_db`'s contract test (add-on B3) — genuinely needs a real
# browser's IndexedDB, so it runs via `wasm-pack test --headless` rather than
# plain `cargo test`. A blanket (non-target-gated) `[dev-dependencies]` would
# pull tokio's multi-thread runtime into a wasm32 test build too, which does
# not support that target at all — hence the split from the block above.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
