# UniFFI config for the plain-JVM generation (the conformance run). Passed with
# --config, which *replaces* the crate's own bindings/uniffi/uniffi.toml for
# this run — so the package name is repeated here. The Android build
# (../android/uniffi.toml) differs in the `android` setting only.
[bindings.kotlin]
package_name = "info.trafficnetwork.client"
android = false
