name: trafficnetwork_flutter
description: The Trafficnetwork client for Flutter apps on Android and iOS - the native library bundled, so adding the package is all an app does.
version: 0.1.0
repository: https://github.com/Romsmo/Trafficnetwork
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # The typed API and the generated bridge; this package only adds the native
  # library for the platforms a Flutter app targets (and loads it).
  trafficnetwork:
    path: ../dart

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
