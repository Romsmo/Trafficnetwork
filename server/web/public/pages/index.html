<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Trafficnetwork</title>
<link rel="icon" href="/web/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/web/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/web/css/app.css">
</head>
<body class="page-map">
<a class="skip-link" href="#main" data-i18n="a11y.skip">Zum Inhalt springen</a>
<header id="site-header"></header>
<div id="safety-banner" class="safety-banner" role="note"></div>
<noscript><p class="safety-banner" data-i18n="noscript">Diese Seite braucht JavaScript. This page needs JavaScript.</p></noscript>

<main id="main" class="map-layout">
  <h1 class="visually-hidden" data-i18n="map.h1">Trafficnetwork – Karte</h1>
  <section id="map-panel">
    <div id="map"></div>
    <div class="map-overlay">
      <form id="place-search" class="place-search" role="search" hidden>
        <label for="place-q" class="visually-hidden" data-i18n="place.label">Ort suchen</label>
        <input id="place-q" type="search" name="q" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" maxlength="120" data-i18n-attr="placeholder:place.placeholder">
        <button type="button" class="icon" data-place-clear hidden data-i18n-attr="aria-label:place.clear;title:place.clear">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path class="icon-line" d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <button type="submit" class="icon" data-i18n-attr="aria-label:place.go;title:place.go">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><circle class="icon-line" cx="10.5" cy="10.5" r="6.5"/><path class="icon-line" d="m15.5 15.5 5 5"/></svg>
        </button>
        <div id="place-panel" class="place-panel" data-place-panel hidden>
          <p class="hint" data-place-status role="status" aria-live="polite"></p>
          <ul class="place-results" data-place-results data-i18n-attr="aria-label:place.results"></ul>
        </div>
      </form>
      <span id="live-chip" class="chip bad"></span>
      <span id="area-chip" class="chip" hidden></span>
      <span id="pick-chip" class="chip" hidden></span>
      <button id="pick-cancel" type="button" class="small" hidden data-i18n="reportDialog.cancel">Abbrechen</button>
    </div>
    <div class="map-controls" role="group" data-i18n-attr="aria-label:map.controls.label">
      <button id="locate" type="button" class="round" data-state="off" aria-label="Auf mich zentrieren" title="Auf mich zentrieren">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path class="icon-fill" d="M3.5 11 20.5 3.5 13 20.5 11.2 12.8Z"/></svg>
      </button>
      <button id="layers-open" type="button" class="round" aria-label="Kategorien und Ebenen" title="Kategorien und Ebenen" aria-controls="sheet-body">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path class="icon-line" d="M12 3 3 8l9 5 9-5-9-5Z"/><path class="icon-line" d="m3 12.5 9 5 9-5"/><path class="icon-line" d="m3 17 9 5 9-5"/></svg>
      </button>
    </div>
    <div id="map-status" class="visually-hidden" role="status" aria-live="polite"></div>
  </section>

  <aside id="sheet" class="side-panel sheet" data-mode="panel" data-detent="small" data-i18n-attr="aria-label:sheet.label">
    <div class="sheet-top">
      <button id="sheet-handle" type="button" class="sheet-handle" aria-controls="sheet-body" aria-expanded="true">
        <span class="grip" aria-hidden="true"></span>
        <span id="sheet-handle-text" class="visually-hidden"></span>
      </button>
      <div class="sheet-head">
        <button id="report-open" type="button" class="primary report-button" data-i18n="map.report.open">Gefahr melden</button>
        <p id="sheet-summary" class="sheet-summary"></p>
      </div>
    </div>
    <div id="sheet-body" class="sheet-body">
      <div id="sheet-detail" class="sheet-detail" hidden>
        <button id="detail-back" type="button" class="small back-button" data-i18n="sheet.back">Zurück zur Übersicht</button>
        <div id="detail-content" class="detail-content"></div>
      </div>
      <div id="sheet-browse" class="sheet-browse">
        <fieldset id="filters" class="filters"></fieldset>
        <h2 id="layers-heading" tabindex="-1" data-i18n="map.layers.title">Karten-Ebenen</h2>
        <label class="layer-toggle"><input id="layer-limits" type="checkbox"><span data-i18n="map.layer.speedlimits">Tempolimits als Straßenfarben zeigen</span></label>
        <p id="limits-hint" class="hint" aria-live="polite"></p>
        <p id="limits-note" class="hint" data-i18n="map.layer.speedlimits.note" hidden></p>
        <button id="query-center" type="button" class="small" data-i18n="map.queryCenter">Tempolimit an der Kartenmitte abfragen</button>
        <div id="signs-box" class="signs-box" hidden>
          <label class="layer-toggle"><input id="layer-signs" type="checkbox"><span data-i18n="map.layer.signs">Verkehrszeichen auf Strecken zeigen</span></label>
          <p id="signs-hint" class="hint" aria-live="polite"></p>
          <button id="sign-add" type="button" class="small" data-i18n="signs.add">Verkehrszeichen eintragen</button>
        </div>
        <h2 data-i18n="map.list.title">Meldungen in diesem Ausschnitt</h2>
        <p id="list-status" class="hint" role="status" aria-live="polite"></p>
        <ul id="report-list" class="report-list"></ul>
        <p class="connect-link"><a href="/connect" data-i18n="map.connect.link">Verbinden: App, eigener Knoten oder API</a></p>
      </div>
      <div id="sheet-footer-slot"></div>
    </div>
  </aside>
</main>

<footer id="site-footer"></footer>
<dialog id="report-dialog"></dialog>
<dialog id="camera-notice"></dialog>
<dialog id="sign-dialog"></dialog>

<script src="/web/vendor/leaflet/leaflet.js"></script>
<script type="module" src="/web/js/map-page.js"></script>
</body>
</html>
