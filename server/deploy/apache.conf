# Example Apache reverse-proxy vhost for a natively-installed (non-Docker)
# server process listening on 127.0.0.1:3000 (see server/README.md's
# "Installation ohne Docker" section).
#
# Required modules (Debian/Ubuntu): a2enmod proxy proxy_http proxy_wstunnel ssl
#
# /v1/ws needs its own ProxyPass using the ws:// scheme (mod_proxy_wstunnel) —
# a plain http:// ProxyPass never performs the WebSocket upgrade handshake.
# It's listed before the catch-all "/" so Apache matches it first.
#
# TLS cert paths below assume certbot's default layout
# (`certbot --apache -d your-server.example.com`), which can also manage this
# vhost's TLS block for you automatically instead of hand-editing it.

<VirtualHost *:443>
    ServerName your-server.example.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/your-server.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/your-server.example.com/privkey.pem

    ProxyPreserveHost On

    ProxyPass "/v1/ws" "ws://127.0.0.1:3000/v1/ws"
    ProxyPassReverse "/v1/ws" "ws://127.0.0.1:3000/v1/ws"

    ProxyPass "/" "http://127.0.0.1:3000/"
    ProxyPassReverse "/" "http://127.0.0.1:3000/"
</VirtualHost>

# Redirect plain HTTP to HTTPS (also handles certbot's HTTP-01 challenge
# before a certificate exists yet — run certbot once with this block alone,
# then add the :443 block above).
<VirtualHost *:80>
    ServerName your-server.example.com
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=permanent]
</VirtualHost>
