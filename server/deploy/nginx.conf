# Example nginx reverse-proxy server block for a natively-installed
# (non-Docker) server process listening on 127.0.0.1:3000 (see
# server/README.md's "Installation ohne Docker" section).
#
# The `map` block computes the right Connection header for both plain HTTP
# requests and WebSocket upgrades from the same location block — Upgrade and
# Connection are hop-by-hop headers nginx doesn't forward by default, so they
# must be set explicitly or the /v1/ws handshake silently fails.
#
# TLS cert paths below assume certbot's default layout
# (`certbot --nginx -d your-server.example.com`), which can also manage this
# server block's TLS directives for you automatically.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name your-server.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-server.example.com;

    ssl_certificate     /etc/letsencrypt/live/your-server.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-server.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upgrade headers only matter for /v1/ws, but setting them here for
        # every path is harmless for plain HTTP requests and keeps this
        # config to a single location block.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
