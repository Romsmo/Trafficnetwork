# CI-only fixture for .github/workflows/server-ci.yml's Apache reverse-proxy
# smoke test — plain HTTP, no TLS (CI doesn't have a real domain/cert to
# test against). The real, TLS-enabled example for operators is
# server/deploy/apache.conf; this file only exists to prove the
# mod_proxy_wstunnel mechanism itself works end to end, including the
# WebSocket upgrade.

<VirtualHost *:80>
    ProxyPreserveHost On

    # "server" resolves via Docker Compose's internal DNS to the `server`
    # service defined in docker-compose.yml, once this container joins that
    # stack's network (see the CI workflow step that runs this fixture).
    ProxyPass "/v1/ws" "ws://server:3000/v1/ws"
    ProxyPassReverse "/v1/ws" "ws://server:3000/v1/ws"

    ProxyPass "/" "http://server:3000/"
    ProxyPassReverse "/" "http://server:3000/"
</VirtualHost>
