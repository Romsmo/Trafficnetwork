name: rn-probe

# Scratch workflow for iterating on the React Native jobs without re-running
# the whole of client-lib-ci: runs only on pushes to the branch `probe/rn`
# (`git push --force origin HEAD:probe/rn`). The jobs are copies of the ones in
# client-lib-ci.yml; whatever works here is the same job there.

on:
  push:
    branches: [probe/rn]

defaults:
  run:
    working-directory: client-lib

jobs:
  # Add-on B5: React Native. The library (a turbo module) is generated around
  # the very UniFFI crate Kotlin and Swift come from, by
  # uniffi-bindgen-react-native: scaffold (bindings/react-native/scaffold.mjs),
  # build the Rust for Android and generate the TypeScript/C++ bindings, type-check
  # the library, and build an example app that uses it. Builds only: the app is
  # not run.
  react-native-android:
    name: build (React Native library + example app, Android)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib
          key: rn-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache cargo-ndk
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-v4

      - name: Install cargo-ndk
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-ndk

      - name: Scaffold the React Native library
        run: node bindings/react-native/scaffold.mjs

      # The library is generated, so there is no lockfile yet; yarn refuses to
      # create one on CI unless told otherwise.
      - name: Install its dependencies
        working-directory: client-lib/bindings/react-native/library
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: |
          corepack enable
          yarn install

      - name: Build the Rust for Android and generate the bindings
        working-directory: client-lib/bindings/react-native/library
        run: yarn ubrn:android

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trafficnetwork-react-native-generated
          path: |
            client-lib/bindings/react-native/library/src
            client-lib/bindings/react-native/library/cpp
            client-lib/bindings/react-native/library/android/CMakeLists.txt
            client-lib/bindings/react-native/library/android/src/main/java
          retention-days: 14

      # `yarn prepare` is react-native-builder-bob: React Native's own codegen
      # (the native module spec the generated Kotlin extends), the JavaScript
      # build of the library, and its type declarations — what a library ships.
      - name: Build the library
        working-directory: client-lib/bindings/react-native/library
        run: yarn prepare

      - name: Type-check the library
        working-directory: client-lib/bindings/react-native/library
        run: yarn typecheck

      - name: Build the example app
        working-directory: client-lib/bindings/react-native/library/example/android
        run: ./gradlew assembleDebug --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a

      # The library as the package a React Native app installs: the Android
      # half here (the Rust for four ABIs, the generated bindings, the JavaScript
      # build); the iOS half is packed by react-native-ios. The release job
      # merges the two.
      - name: Pack the library (Android half)
        working-directory: client-lib/bindings/react-native/library
        run: |
          mkdir -p "$GITHUB_WORKSPACE/client-lib/dist/rn"
          yarn pack --out "$GITHUB_WORKSPACE/client-lib/dist/rn/trafficnetwork-react-native-android.tgz"
          tar tzf "$GITHUB_WORKSPACE/client-lib/dist/rn/trafficnetwork-react-native-android.tgz" | grep -E "jniLibs|lib/module|src/generated" | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: trafficnetwork-react-native-android
          path: client-lib/dist/rn/trafficnetwork-react-native-android.tgz
          retention-days: 14

  # The same on iOS, on a macOS runner: the Rust for the iOS targets as an
  # XCFramework, the bindings, `pod install`, and the example app built for the
  # simulator. Builds only: the app is not run.
  react-native-ios:
    name: build (React Native library + example app, iOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib
          key: rn-ios

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scaffold the React Native library
        run: node bindings/react-native/scaffold.mjs

      - name: Install its dependencies
        working-directory: client-lib/bindings/react-native/library
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: |
          corepack enable
          yarn install

      - name: Build the Rust for iOS and generate the bindings
        working-directory: client-lib/bindings/react-native/library
        run: yarn ubrn:ios

      - name: Build the library
        working-directory: client-lib/bindings/react-native/library
        run: yarn prepare

      # After the codegen: the pods list the files it wrote.
      - name: Install the pods
        working-directory: client-lib/bindings/react-native/library
        run: yarn ubrn:pods

      - name: Build the example app for the simulator
        working-directory: client-lib/bindings/react-native/library/example/ios
        run: |
          workspace=$(ls -d *.xcworkspace | head -1)
          scheme="${workspace%.xcworkspace}"
          xcodebuild build -workspace "$workspace" -scheme "$scheme" -configuration Debug             -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'             -derivedDataPath build CODE_SIGNING_ALLOWED=NO

      - name: Pack the library (iOS half)
        working-directory: client-lib/bindings/react-native/library
        run: |
          mkdir -p "$GITHUB_WORKSPACE/client-lib/dist/rn"
          yarn pack --out "$GITHUB_WORKSPACE/client-lib/dist/rn/trafficnetwork-react-native-ios.tgz"
          tar tzf "$GITHUB_WORKSPACE/client-lib/dist/rn/trafficnetwork-react-native-ios.tgz" | grep -E "xcframework|lib/module|ios/generated" | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: trafficnetwork-react-native-ios
          path: client-lib/dist/rn/trafficnetwork-react-native-ios.tgz
          retention-days: 14

