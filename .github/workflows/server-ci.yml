name: server-ci

on:
  push:
    # main plus any rework/* branch (e.g. rework/server-federation) — a
    # feature branch needs its own CI signal per milestone, per
    # work order "rework-server-federation" (kept outside the repo)'s "nach jedem Meilenstein:
    # Build + Tests (auch CI) grün" — not just once at PR time.
    branches: [main, "rework/**"]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"

defaults:
  run:
    working-directory: server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

  e2e:
    # The node's web UI in a real browser (Chromium) against real node processes and a real PostGIS
    # database (Testcontainers) — see server/e2e and server/docs/web-ui.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            server/playwright-report
            server/test-results
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Build only, both architectures — no push/publish without explicit
      # approval (see work order "rework-server-federation" (kept outside the repo) section 5).
      - name: Build multi-arch image (validation only, no push)
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: false

  install-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-smoke-test-password
      JWT_SECRET: ci-smoke-test-jwt-secret-32-chars
      JOIN_PUBLIC_ADDRESS: https://smoke.example.org
    steps:
      - uses: actions/checkout@v4

      - name: Start docker-compose stack
        run: docker compose up -d --build

      - name: Wait for the server to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/v1/health | grep -q '"status":"ok"'; then
              echo "Server healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time"
          docker compose logs
          exit 1

      # The join code (server/docs/join-code.md): made at the first start, on the volume with 0600, shown on the page, usable.
      # Nothing here prints the code.
      - name: Join code is created, shown, and registers a device
        run: |
          curl -sf http://localhost:3000/join-code.json | grep -q '"available":true'
          curl -sf http://localhost:3000/join | grep -q join-page.js
          docker compose exec -T server node dist/join-cli.js show | grep -q 'trafficnetwork://join?v=1&n=smoke.example.org'
          docker compose exec -T server node dist/join-cli.js list | grep -q 'public'
          test "$(docker compose exec -T server stat -c %a /app/data/join/public.join)" = 600
          docker compose exec -T server node --input-type=module -e '
          import { readFileSync } from "node:fs";
          import { parseJoinUri, deriveCredentials } from "./dist/modules/join/code.js";
          const c = deriveCredentials(parseJoinUri(readFileSync("/app/data/join/public.join", "utf8").trim()).seed);
          const base = "http://127.0.0.1:3000";
          const t = await fetch(base + "/v1/auth/token", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ clientId: c.clientId, clientSecret: c.clientSecret }) });
          if (!t.ok) throw new Error("token: HTTP " + t.status);
          const r = await fetch(base + "/v1/devices/register", { method: "POST", headers: { authorization: "Bearer " + (await t.json()).accessToken } });
          if (!r.ok) throw new Error("register: HTTP " + r.status);
          console.log("registered a device with the join code: HTTP", r.status);
          '
          # a restart makes no second code
          docker compose restart server
          for i in $(seq 1 30); do curl -sf http://localhost:3000/v1/health >/dev/null && break; sleep 1; done
          test "$(docker compose exec -T server node dist/join-cli.js list | grep -c public)" = 1

      - name: Build Apache reverse-proxy smoke-test image
        run: docker build -f tests/fixtures/apache-smoke.Dockerfile -t apache-smoke tests/fixtures

      - name: Run Apache in front of the server (shares the compose network)
        run: docker run -d --name apache-smoke --network trafficnetwork -p 8080:80 apache-smoke

      - name: Wait for Apache to come up
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/v1/health | grep -q '"status":"ok"'; then
              echo "Apache proxy healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Apache proxy did not become healthy in time"
          docker logs apache-smoke
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: WebSocket upgrade through the Apache proxy (mod_proxy_wstunnel)
        run: node tests/fixtures/ws-smoke.mjs ws://localhost:8080/v1/ws

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose logs
          docker logs apache-smoke || true

      - name: Tear down
        if: always()
        run: |
          docker rm -f apache-smoke || true
          docker compose down -v
