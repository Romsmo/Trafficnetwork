name: client-lib-ci

on:
  push:
    branches: [main, "rework/client-lib-*"]
    paths:
      - "client-lib/**"
      - "server/tests/support/**"
      - ".github/workflows/client-lib-ci.yml"
  pull_request:
    paths:
      - "client-lib/**"
      - "server/tests/support/**"
      - ".github/workflows/client-lib-ci.yml"
  # The release workflow (release.yml, tag client-lib-v*) runs these very jobs
  # and attaches the artifacts they produce: what is released is what was tested.
  workflow_call:

# A newer push to the same branch makes the older run pointless (and the macOS
# jobs are slow): cancel it.
concurrency:
  group: client-lib-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client-lib

jobs:
  # Its own job (rather than the first step of `test`) so that a formatting
  # slip does not hide the compiler's and the tests' answer behind it.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

  test:
    name: build, test, lint (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      # Cargo.lock is meant to be committed here (see the .gitignore comment:
      # client-lib ships as prebuilt per-platform artifacts, not as a source
      # dependency, so the usual "libraries don't commit their lockfile"
      # advice doesn't apply) — but no session in this project has local
      # Rust, so it can only ever be produced here. Uploaded on every run;
      # download and commit it whenever this differs from what's checked in.
      - uses: actions/upload-artifact@v4
        with:
          name: client-lib-cargo-lock
          path: client-lib/Cargo.lock
          retention-days: 14

  wasm-build:
    name: build (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib
          key: wasm32

      # bindings/c-abi is cdylib/staticlib (native-linking crate-types) and
      # isn't meaningful on wasm32 — skipped here; bindings/wasm (add-on B3)
      # is the wasm32-specific binding crate that exists instead.
      - name: Build core and the wasm binding for wasm32
        run: cargo build -p trafficnetwork-core -p trafficnetwork-wasm --target wasm32-unknown-unknown

  # Add-on B3: runs core's wasm32-only unit tests (`storage::IndexedDbStore`)
  # in a real headless browser, not just compiling them — a real IndexedDB,
  # not a mock, the same "prove it against the real thing" standard as B2's
  # multi-node job. `wasm-pack` also builds `trafficnetwork-wasm` itself with
  # its actual JS/TS-facing target (`--target web`), a stronger check than
  # `wasm-build`'s plain `cargo build` (catches any wasm-bindgen-specific
  # export issue that a plain library build wouldn't).
  wasm-test:
    name: test (wasm32, headless browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib
          key: wasm32

      # Pinned: "latest" once resolved to wasm-pack 0.9.1 (which cannot read a
      # workspace-inherited `license`) and failed the job at random.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"

      # Two different mechanisms keep native-only targets out of this build:
      # wasm-pack first builds every *test* target (`cargo build --tests`), so
      # `tests/multi_node.rs` is gated `#![cfg(not(target_arch = "wasm32"))]`
      # in the file itself; the actual `cargo test` step then also builds
      # *examples* (`examples/measure_bootstrap.rs` needs tokio, flate2 and
      # SQLite), which `-- --lib` keeps out.
      - name: Run core's wasm32 unit tests in headless Chrome
        working-directory: client-lib/core
        run: wasm-pack test --headless --chrome -- --lib

      - name: Build the wasm binding for the browser
        working-directory: client-lib/bindings/wasm
        run: wasm-pack build --target web --out-dir pkg

  crypto-cross-lang-vector:
    name: cross-language crypto vector (Rust -> Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install fixture dependencies
        working-directory: client-lib/fixtures
        run: npm install

      - name: Generate vector with the Rust core and verify it with the server's own crypto stack (canonicalize + node:crypto)
        run: cargo run -p trafficnetwork-core --example gen_vector | node fixtures/verify-vector.mjs

  c-abi-header:
    name: cbindgen header generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib

      - name: Install cbindgen
        run: cargo install --locked cbindgen

      - name: Build c-abi crate
        run: cargo build -p trafficnetwork-c-abi

      - name: Generate C header
        working-directory: client-lib/bindings/c-abi
        run: cbindgen --config cbindgen.toml --output trafficnetwork.h

      - name: Header sanity check (non-empty, declares expected symbols)
        working-directory: client-lib/bindings/c-abi
        run: |
          test -s trafficnetwork.h
          grep -q "tn_generate_keypair" trafficnetwork.h
          grep -q "tn_sign_envelope" trafficnetwork.h
          grep -q "tn_verify_envelope" trafficnetwork.h
          grep -q "tn_free_string" trafficnetwork.h
          grep -q "tn_client_new" trafficnetwork.h
          grep -q "tn_client_call" trafficnetwork.h
          grep -q "tn_client_call_async" trafficnetwork.h
          grep -q "tn_client_new_with_secure_store" trafficnetwork.h
          grep -q "tn_client_set_event_callback" trafficnetwork.h
          grep -q "tn_client_free" trafficnetwork.h

      - uses: actions/upload-artifact@v4
        with:
          name: trafficnetwork-c-header
          path: client-lib/bindings/c-abi/trafficnetwork.h
          retention-days: 14

  # The C ABI on every desktop platform it is meant for: it builds, its own
  # tests pass, and the release library is kept as an artifact. The Linux
  # build is also what most other jobs here use; Windows and macOS are only
  # ever built here.
  c-abi:
    name: build + test (C ABI, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu runner on purpose: a library built against an
          # older glibc loads on more systems.
          - os: ubuntu-22.04
            library: libtrafficnetwork.so
          - os: macos-latest
            library: libtrafficnetwork.dylib
          - os: windows-latest
            library: trafficnetwork.dll
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: client-lib
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib
          key: c-abi

      - name: Test
        run: cargo test -p trafficnetwork-c-abi

      - name: Build the release library
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            # One library for Apple silicon and Intel Macs.
            cargo build -p trafficnetwork-c-abi --release --target aarch64-apple-darwin
            cargo build -p trafficnetwork-c-abi --release --target x86_64-apple-darwin
            lipo -create -output dist/${{ matrix.library }}               target/aarch64-apple-darwin/release/${{ matrix.library }}               target/x86_64-apple-darwin/release/${{ matrix.library }}
            mkdir -p target/release && cp dist/${{ matrix.library }} target/release/
          else
            cargo build -p trafficnetwork-c-abi --release
            cp target/release/${{ matrix.library }} dist/
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: trafficnetwork-c-abi-${{ matrix.os }}
          path: client-lib/dist/${{ matrix.library }}
          retention-days: 14

      # What docs/integration-c.md tells a reader to build must work, not merely
      # compile: the header from cbindgen, the example compiled and linked with
      # the platform's own C compiler, and run against the scripted server.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache cbindgen
        id: cbindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cbindgen*
          key: cbindgen-${{ runner.os }}-v1

      - name: Install cbindgen
        if: steps.cbindgen-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cbindgen

      - name: Generate the header
        working-directory: client-lib/bindings/c-abi
        run: cbindgen --config cbindgen.toml --output trafficnetwork.h

      - name: Compile the integration guide's example
        working-directory: client-lib/bindings/c-abi/example
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            gcc example.c -I.. ../../../target/release/trafficnetwork.dll -o example.exe
            cp ../../../target/release/trafficnetwork.dll .
          else
            cc example.c -I.. -L../../../target/release -ltrafficnetwork -o example
          fi

      - name: Run it against the scripted server
        working-directory: client-lib/bindings/c-abi/example
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/client-lib/target/release
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/client-lib/target/release
        run: |
          node ../../../conformance/mock-server.mjs --port 18998 > mock.log 2>&1 &
          for i in $(seq 1 50); do
            curl -sf -X POST http://127.0.0.1:18998/__instances -d '{}' > /dev/null && break
            sleep 0.2
          done
          URL=$(curl -sf -X POST http://127.0.0.1:18998/__instances -d '{}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).url))")
          if [ "$RUNNER_OS" = "Windows" ]; then program=./example.exe; else program=./example; fi
          TN_NODE="$URL" TN_CLIENT_ID=example TN_CLIENT_SECRET=example "$program" | tee example.out
          grep -q "sync ok: true" example.out
          grep -q "queued report; sync ok: true" example.out

      - name: Scripted server log
        if: failure()
        run: cat client-lib/bindings/c-abi/example/mock.log

  # The conformance scenarios (conformance/scenarios.json) through each binding,
  # against the scripted server (conformance/mock-server.mjs). Every binding
  # runs the same scenarios and has to give the same answers. The Python
  # binding runs on all three desktop platforms — the C ABI is the same code
  # there, the operating system's file, process and network behavior is not.
  conformance-python:
    name: conformance (Python over the C ABI, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            library: libtrafficnetwork.so
          - os: macos-latest
            library: libtrafficnetwork.dylib
          - os: windows-latest
            library: trafficnetwork.dll
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: client-lib
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib
          key: python

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the native library
        run: cargo build -p trafficnetwork-c-abi

      - name: Start the scripted server
        run: |
          node conformance/mock-server.mjs --port 18990 > mock.log 2>&1 &
          for i in $(seq 1 50); do
            curl -sf -X POST http://127.0.0.1:18990/__instances -d '{}' > /dev/null && break
            sleep 0.2
          done

      - name: Run the scenarios
        env:
          MOCK_URL: http://127.0.0.1:18990
          TRAFFICNETWORK_LIB: ${{ github.workspace }}/client-lib/target/debug/${{ matrix.library }}
        run: python conformance/run_python.py

      # What docs/integration-python.md tells a reader to run must work, not merely
      # compile: its example, against the mock, with a check that it really synced
      # and queued a report.
      - name: Run the integration guide's example
        working-directory: client-lib/bindings/python
        env:
          TRAFFICNETWORK_LIB: ${{ github.workspace }}/client-lib/target/debug/${{ matrix.library }}
          PYTHONPATH: .
        run: |
          URL=$(curl -sf -X POST http://127.0.0.1:18990/__instances -d '{}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).url))")
          TN_NODE="$URL" TN_CLIENT_ID=example TN_CLIENT_SECRET=example python example.py | tee example.out
          grep -q "sync ok: true" example.out
          grep -q "queued report" example.out

      - name: Scripted server log
        if: failure()
        run: cat mock.log

  # Add-on B3: the same scenarios through the Node.js binding (bindings/node,
  # FFI over the C ABI via koffi) — the shared scenario logic is
  # conformance/scenario-runner.mjs, the same file the browser run uses.
  conformance-node:
    name: conformance (Node.js over the C ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the native library
        run: cargo build -p trafficnetwork-c-abi

      - name: Install the binding's dependencies
        working-directory: client-lib/bindings/node
        run: npm ci

      - name: Start the scripted server
        run: |
          node conformance/mock-server.mjs --port 18991 > mock.log 2>&1 &
          for i in $(seq 1 50); do
            curl -sf -X POST http://127.0.0.1:18991/__instances -d '{}' > /dev/null && break
            sleep 0.2
          done

      - name: Run the scenarios
        env:
          MOCK_URL: http://127.0.0.1:18991
          TRAFFICNETWORK_LIB: ${{ github.workspace }}/client-lib/target/debug/libtrafficnetwork.so
        run: node conformance/run_node.mjs

      # What docs/integration-node.md tells a reader to run must work, not
      # merely compile: the guide's example, against the mock, with a check
      # that it really synced and queued a report.
      - name: Run the integration guide's example
        env:
          TRAFFICNETWORK_LIB: ${{ github.workspace }}/client-lib/target/debug/libtrafficnetwork.so
        run: |
          URL=$(curl -sf -X POST http://127.0.0.1:18991/__instances -d '{}'             | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).url))")
          TN_NODE="$URL" TN_CLIENT_ID=example TN_CLIENT_SECRET=example             node bindings/node/example.mjs | tee example.out
          grep -q "sync ok: true" example.out
          grep -q "queued report" example.out

      - name: Scripted server log
        if: failure()
        run: cat mock.log

  # Add-on B3: the same scenarios through the WebAssembly binding, in a real
  # headless Chrome — IndexedDB, fetch() and localStorage only exist there,
  # and a browser is the one place this binding is meant to run.
  conformance-web:
    name: conformance (WebAssembly in headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib
          key: wasm32

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned: "latest" once resolved to wasm-pack 0.9.1 (which cannot read a
      # workspace-inherited `license`) and failed the job at random.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"

      - name: Build the browser package
        working-directory: client-lib/bindings/wasm
        run: wasm-pack build --target web --out-dir pkg

      - name: Install the runner's dependencies
        working-directory: client-lib/conformance
        run: npm ci

      - name: Start the scripted server
        run: |
          node conformance/mock-server.mjs --port 18992 > mock.log 2>&1 &
          for i in $(seq 1 50); do
            curl -sf -X POST http://127.0.0.1:18992/__instances -d '{}' > /dev/null && break
            sleep 0.2
          done

      # puppeteer-core drives the Chrome already installed on the runner,
      # instead of downloading a second browser.
      - name: Run the scenarios in Chrome
        env:
          MOCK_URL: http://127.0.0.1:18992
          CHROME_PATH: /usr/bin/google-chrome
        run: node conformance/run_web.mjs

      # Same standard as the Node guide: the browser example docs/integration-web.md
      # tells a reader to open is driven like a person would, and must work.
      - name: Run the integration guide's example in Chrome
        env:
          MOCK_URL: http://127.0.0.1:18992
          CHROME_PATH: /usr/bin/google-chrome
        run: node conformance/run_web_example.mjs

      - name: Scripted server log
        if: failure()
        run: cat mock.log

  # Add-on B4: the same scenarios through the Kotlin that UniFFI generates,
  # run on a plain JVM against a Linux build of the very same library the
  # Android AAR contains (no emulator: the Kotlin layer and the Rust code are
  # the shipped ones, only the CPU/OS differ). conformance/bridge-client.mjs
  # lets the one scenario runner drive it — see conformance/README.md.
  conformance-kotlin:
    name: conformance (Kotlin over UniFFI, on the JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build the UniFFI library
        run: cargo build -p trafficnetwork-uniffi

      - name: Generate the Kotlin wrapper from it
        run: bash bindings/kotlin/generate.sh jvm target/debug/libtrafficnetwork_uniffi.so

      - name: Build the conformance bridge
        working-directory: client-lib/bindings/kotlin/jvm
        run: gradle installDist --no-daemon

      - name: Install the runner's dependencies
        working-directory: client-lib/conformance
        run: npm ci

      - name: Start the scripted server
        run: |
          node conformance/mock-server.mjs --port 18993 > mock.log 2>&1 &
          for i in $(seq 1 50); do
            curl -sf -X POST http://127.0.0.1:18993/__instances -d '{}' > /dev/null && break
            sleep 0.2
          done

      - name: Run the scenarios (secrets in the library's file)
        env:
          MOCK_URL: http://127.0.0.1:18993
          JAVA_OPTS: -Djna.library.path=${{ github.workspace }}/client-lib/target/debug
        run: node conformance/run_bridge.mjs --name kotlin -- bindings/kotlin/jvm/build/install/trafficnetwork-kotlin-jvm/bin/trafficnetwork-kotlin-jvm

      # The same scenarios again, with the device's secrets in a store the
      # host (Kotlin) implements — the library calling back into Kotlin, which
      # is what the Android Keystore binding rests on.
      - name: Run the scenarios (secrets in a store implemented in Kotlin)
        env:
          MOCK_URL: http://127.0.0.1:18993
          JAVA_OPTS: -Djna.library.path=${{ github.workspace }}/client-lib/target/debug
        run: node conformance/run_bridge.mjs --name kotlin --host-secure-store -- bindings/kotlin/jvm/build/install/trafficnetwork-kotlin-jvm/bin/trafficnetwork-kotlin-jvm

      # What docs/integration-android.md tells a reader to write must work,
      # not merely compile: its example (the same calls as in an Activity),
      # against the mock, with a check that it really synced and queued a report.
      - name: Run the integration guide's example
        run: |
          URL=$(curl -sf -X POST http://127.0.0.1:18993/__instances -d '{}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).url))")
          TN_NODE="$URL" TN_CLIENT_ID=example TN_CLIENT_SECRET=example             java -Djna.library.path="$PWD/target/debug"             -cp 'bindings/kotlin/jvm/build/install/trafficnetwork-kotlin-jvm/lib/*'             info.trafficnetwork.example.ExampleKt | tee example.out
          grep -q "sync ok: true" example.out
          grep -q "queued report" example.out

      - name: Scripted server log
        if: failure()
        run: cat mock.log

  # Add-on B4: the Android library. The native library for all four Android
  # ABIs (cargo-ndk, the NDK preinstalled on the runner), the Kotlin UniFFI
  # generates from it, packaged by Gradle into an AAR — the artifact an Android
  # app depends on. What this proves is that it *builds* and contains what it
  # should; running it on a device or emulator is not done here (the Kotlin
  # layer and the Rust code it wraps are run by `conformance-kotlin`, on a
  # JVM). docs/integration-android.md says so too.
  android-aar:
    name: build (Android AAR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib
          key: android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk

      - name: Build the native library for every Android ABI
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86             -o bindings/kotlin/android/src/main/jniLibs             build --release -p trafficnetwork-uniffi

      # The generator only reads the UniFFI description out of the library, so
      # one ABI's file is as good as another's.
      - name: Generate the Kotlin wrapper
        run: bash bindings/kotlin/generate.sh android bindings/kotlin/android/src/main/jniLibs/arm64-v8a/libtrafficnetwork_uniffi.so

      # After generating, because the generator reads the UniFFI description
      # out of the library's symbols. Gradle cannot strip without an NDK of
      # its own, and the library is a third of the size without them.
      - name: Strip the symbols
        run: |
          strip="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          for lib in bindings/kotlin/android/src/main/jniLibs/*/libtrafficnetwork_uniffi.so; do
            "$strip" --strip-unneeded "$lib"
          done
          ls -l bindings/kotlin/android/src/main/jniLibs/*/

      # The example app is what docs/integration-android.md walks through;
      # building it proves the guide's code compiles against the library.
      - name: Build the AAR and the example app
        working-directory: client-lib/bindings/kotlin/android
        run: gradle assembleRelease :example:assembleDebug --no-daemon

      - name: Check what is in the AAR
        working-directory: client-lib/bindings/kotlin/android
        run: |
          aar=$(ls build/outputs/aar/*-release.aar)
          unzip -l "$aar"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l "$aar" | grep -q "jni/$abi/libtrafficnetwork_uniffi.so"
          done
          unzip -l "$aar" | grep -q "classes.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: trafficnetwork-android-aar
          path: client-lib/bindings/kotlin/android/build/outputs/aar/*-release.aar
          retention-days: 14

  # Add-on B4: the Swift package and its XCFramework (iOS device, iOS
  # simulator, macOS), on a macOS runner — Xcode only exists there. Builds the
  # package for macOS and for iOS (device and simulator), and runs the same
  # conformance scenarios through the generated Swift on macOS. What is *not*
  # done: running anything inside an iOS simulator — the iOS slices are built
  # and linked, and it is the same Rust library and the same generated Swift
  # that run on macOS here. docs/integration-ios.md says so too.
  swift-package:
    name: build + conformance (Swift package, macOS runner)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib
          key: apple

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the XCFramework and generate the Swift wrapper
        run: bash bindings/swift/build-xcframework.sh

      - name: Build the package for macOS
        working-directory: client-lib/bindings/swift
        run: swift build

      - name: Build the package for iOS (device and simulator)
        working-directory: client-lib/bindings/swift
        run: |
          xcodebuild build -scheme TrafficNetwork -destination 'generic/platform=iOS' -derivedDataPath .build/xcode-ios
          xcodebuild build -scheme TrafficNetwork -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/xcode-ios-sim

      - name: Build the conformance bridge
        working-directory: client-lib/bindings/swift/conformance
        run: swift build

      - name: Install the runner's dependencies
        working-directory: client-lib/conformance
        run: npm ci

      - name: Start the scripted server
        run: |
          node conformance/mock-server.mjs --port 18994 > mock.log 2>&1 &
          for i in $(seq 1 50); do
            curl -sf -X POST http://127.0.0.1:18994/__instances -d '{}' > /dev/null && break
            sleep 0.2
          done

      - name: Run the scenarios (secrets in the library's file)
        env:
          MOCK_URL: http://127.0.0.1:18994
        run: node conformance/run_bridge.mjs --name swift -- bindings/swift/conformance/.build/debug/TrafficNetworkBridge

      - name: Run the scenarios (secrets in a store implemented in Swift)
        env:
          MOCK_URL: http://127.0.0.1:18994
        run: node conformance/run_bridge.mjs --name swift --host-secure-store -- bindings/swift/conformance/.build/debug/TrafficNetworkBridge

      # What docs/integration-ios.md tells a reader to write must work, not
      # merely compile: its example (the same calls as in a SwiftUI view),
      # against the mock, with a check that it really synced and queued a report.
      - name: Run the integration guide's example
        working-directory: client-lib/bindings/swift/example
        run: |
          URL=$(curl -sf -X POST http://127.0.0.1:18994/__instances -d '{}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).url))")
          TN_NODE="$URL" TN_CLIENT_ID=example TN_CLIENT_SECRET=example swift run | tee example.out
          grep -q "sync ok: true" example.out
          grep -q "queued report" example.out

      - name: Scripted server log
        if: failure()
        run: cat mock.log

      - uses: actions/upload-artifact@v4
        with:
          name: trafficnetwork-swift-package
          path: |
            client-lib/bindings/swift/Package.swift
            client-lib/bindings/swift/Sources
            client-lib/bindings/swift/TrafficNetworkFFI.xcframework
          retention-days: 14

  # Add-on B4: the Dart/Flutter package. flutter_rust_bridge generates the
  # Dart half and the Rust glue from bindings/dart/rust/src/api/; both are
  # checked in, so this job regenerates them and fails if they differ - the
  # checked-in code cannot drift from the Rust it was generated from. Then the
  # package is analyzed and the same scenarios run through it (Dart VM on
  # Linux: the Dart FFI layer and the Rust code are the ones a Flutter app
  # on a phone uses; no emulator is involved).
  dart-package:
    name: build + conformance (Dart/Flutter package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib/bindings/dart/rust

      - uses: dart-lang/setup-dart@v1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The generator also needs cargo-expand, which it would otherwise
      # install itself on every run (two minutes).
      - name: Cache the code generator
        id: codegen-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen
            ~/.cargo/bin/cargo-expand
          key: frb-codegen-2.13.0-${{ runner.os }}

      - name: Install the code generator
        if: steps.codegen-cache.outputs.cache-hit != 'true'
        run: |
          cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
          cargo install cargo-expand --locked

      - name: Install the package's dependencies
        working-directory: client-lib/bindings/dart
        run: dart pub get

      - name: Generate the Dart half and the Rust glue
        working-directory: client-lib/bindings/dart
        run: flutter_rust_bridge_codegen generate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trafficnetwork-dart-generated
          path: |
            client-lib/bindings/dart/lib/src/rust
            client-lib/bindings/dart/rust/src/frb_generated.rs
            client-lib/bindings/dart/rust/Cargo.lock
          retention-days: 14

      - name: The checked-in generated code is current
        run: |
          git status --porcelain -- bindings/dart/lib bindings/dart/rust/src
          test -z "$(git status --porcelain -- bindings/dart/lib bindings/dart/rust/src)"

      - name: Rust formatting of the glue crate
        working-directory: client-lib/bindings/dart/rust
        run: cargo fmt -- --check

      - name: Analyze the Dart package
        working-directory: client-lib/bindings/dart
        run: dart analyze --fatal-infos

      - name: Build the native library
        working-directory: client-lib/bindings/dart/rust
        run: cargo build

      - name: Install the runner's dependencies
        working-directory: client-lib/conformance
        run: npm ci

      - name: Start the scripted server
        run: |
          node conformance/mock-server.mjs --port 18995 > mock.log 2>&1 &
          for i in $(seq 1 50); do
            curl -sf -X POST http://127.0.0.1:18995/__instances -d '{}' > /dev/null && break
            sleep 0.2
          done

      - name: Run the scenarios (secrets in the library's file)
        env:
          MOCK_URL: http://127.0.0.1:18995
          TN_DART_LIB: ${{ github.workspace }}/client-lib/bindings/dart/rust/target/debug/libtrafficnetwork_dart.so
        run: node conformance/run_bridge.mjs --name dart --cwd bindings/dart -- dart run bin/conformance_bridge.dart

      - name: Run the scenarios (secrets in a store implemented in Dart)
        env:
          MOCK_URL: http://127.0.0.1:18995
          TN_DART_LIB: ${{ github.workspace }}/client-lib/bindings/dart/rust/target/debug/libtrafficnetwork_dart.so
        run: node conformance/run_bridge.mjs --name dart --host-secure-store --cwd bindings/dart -- dart run bin/conformance_bridge.dart

      # What docs/integration-flutter.md tells a reader to write must work,
      # not merely compile.
      - name: Run the integration guide's example
        working-directory: client-lib/bindings/dart
        env:
          TN_DART_LIB: ${{ github.workspace }}/client-lib/bindings/dart/rust/target/debug/libtrafficnetwork_dart.so
        run: |
          URL=$(curl -sf -X POST http://127.0.0.1:18995/__instances -d '{}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).url))")
          TN_NODE="$URL" TN_CLIENT_ID=example TN_CLIENT_SECRET=example             dart run example/trafficnetwork_example.dart | tee example.out
          grep -q "sync ok: true" example.out
          grep -q "queued report" example.out

      - name: Scripted server log
        if: failure()
        run: cat mock.log

  # Add-on B5: the npm packages as tarballs that stand on their own
  # (bindings/pack-npm.mjs), and proof that what is in them works: they are
  # installed into an empty project, and the guides' examples run from the
  # *installed* packages — the Node one against the mock server, the browser
  # one in headless Chrome. The tarballs are kept as artifacts; nothing is
  # published.
  npm-packages:
    name: npm packages (pack, install, run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib
          key: npm

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned: see the comment at the first use of this action.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"

      - name: Build the WebAssembly package and the native library
        run: |
          (cd bindings/wasm && wasm-pack build --target web --out-dir pkg)
          cargo build -p trafficnetwork-c-abi

      - name: Pack
        run: node bindings/pack-npm.mjs "$PWD/dist/npm"

      - name: Start the scripted server
        run: |
          node conformance/mock-server.mjs --port 18996 > mock.log 2>&1 &
          for i in $(seq 1 50); do
            curl -sf -X POST http://127.0.0.1:18996/__instances -d '{}' > /dev/null && break
            sleep 0.2
          done

      - name: Install the Node package into an empty project and run its example
        env:
          TRAFFICNETWORK_LIB: ${{ github.workspace }}/client-lib/target/debug/libtrafficnetwork.so
        run: |
          mkdir -p "$RUNNER_TEMP/consumer-node" && cd "$RUNNER_TEMP/consumer-node"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/client-lib/dist/npm/trafficnetwork-client-node-*.tgz
          node --input-type=module -e "import { libraryVersion } from '@trafficnetwork/client-node'; console.log('library', libraryVersion())"
          URL=$(curl -sf -X POST http://127.0.0.1:18996/__instances -d '{}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).url))")
          TN_NODE="$URL" TN_CLIENT_ID=example TN_CLIENT_SECRET=example             node node_modules/@trafficnetwork/client-node/example.mjs | tee example.out
          grep -q "sync ok: true" example.out
          grep -q "queued report" example.out

      - name: Install the browser package into an empty project and run its example in Chrome
        env:
          MOCK_URL: http://127.0.0.1:18996
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          mkdir -p "$RUNNER_TEMP/consumer-web" && cd "$RUNNER_TEMP/consumer-web"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/client-lib/dist/npm/trafficnetwork-client-web-*.tgz
          cd "$GITHUB_WORKSPACE/client-lib/conformance" && npm ci
          TN_WEB_PACKAGE="$RUNNER_TEMP/consumer-web/node_modules/@trafficnetwork/client-web"             node run_web_example.mjs

      - name: Scripted server log
        if: failure()
        run: cat mock.log

      - uses: actions/upload-artifact@v4
        with:
          name: trafficnetwork-npm-packages
          path: client-lib/dist/npm/*.tgz
          retention-days: 14

  # Add-on B5: the Flutter plugin (bindings/flutter) with the native library
  # bundled, on Android: the library for four ABIs built into the plugin, a
  # brand-new Flutter app created the way docs/integration-flutter.md says
  # (`flutter create`, add the package, paste the example), and that app
  # built. What this proves is that it builds and that the APK contains the
  # library; it does not run the app (see the emulator step, if present, for
  # what does).
  flutter-android:
    name: build (Flutter plugin + example app, Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib/bindings/dart/rust
          key: flutter-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache cargo-ndk
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-v4

      - name: Install cargo-ndk
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-ndk

      - name: Build the native library into the plugin
        run: bash bindings/flutter/build-native.sh android

      - name: Create a Flutter app that uses the plugin, and build it
        run: |
          cd "$RUNNER_TEMP"
          flutter create --platforms=android --project-name trafficnetwork_example_app app
          cd app
          flutter pub add path_provider
          flutter pub add trafficnetwork_flutter --path "$GITHUB_WORKSPACE/client-lib/bindings/flutter"
          cp "$GITHUB_WORKSPACE/client-lib/bindings/flutter/example/lib/main.dart" lib/main.dart
          rm -f test/widget_test.dart   # the template's test is for the template's main.dart
          flutter analyze
          flutter build apk --debug
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep libtrafficnetwork_dart.so
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/client-lib/flutter-example-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: trafficnetwork-flutter-plugin-android
          path: |
            client-lib/bindings/flutter/pubspec.yaml
            client-lib/bindings/flutter/lib
            client-lib/bindings/flutter/android
            client-lib/bindings/flutter/LICENSE
            client-lib/flutter-example-debug.apk
          retention-days: 14

  # The same on iOS, on a macOS runner: the static library as an XCFramework in
  # the plugin, a fresh Flutter app, built for a device (release, unsigned) and
  # for the simulator. It builds and links; it is not run here.
  flutter-ios:
    name: build (Flutter plugin + example app, iOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib/bindings/dart/rust
          key: flutter-ios

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build the native library into the plugin
        run: bash bindings/flutter/build-native.sh ios

      - name: Create a Flutter app that uses the plugin, and build it
        run: |
          cd "$RUNNER_TEMP"
          flutter create --platforms=ios --project-name trafficnetwork_example_app app
          cd app
          flutter pub add path_provider
          flutter pub add trafficnetwork_flutter --path "$GITHUB_WORKSPACE/client-lib/bindings/flutter"
          cp "$GITHUB_WORKSPACE/client-lib/bindings/flutter/example/lib/main.dart" lib/main.dart
          rm -f test/widget_test.dart   # the template's test is for the template's main.dart
          flutter analyze
          flutter build ios --release --no-codesign
          flutter build ios --simulator --debug

      - uses: actions/upload-artifact@v4
        with:
          name: trafficnetwork-flutter-plugin-ios
          path: |
            client-lib/bindings/flutter/pubspec.yaml
            client-lib/bindings/flutter/lib
            client-lib/bindings/flutter/ios
            client-lib/bindings/flutter/LICENSE
          retention-days: 14

  # Add-on B5: React Native. The library (a turbo module) is generated around
  # the very UniFFI crate Kotlin and Swift come from, by
  # uniffi-bindgen-react-native: scaffold (bindings/react-native/scaffold.mjs),
  # build the Rust for Android and generate the TypeScript/C++ bindings, type-check
  # the library, and build an example app that uses it. Builds only: the app is
  # not run.
  react-native-android:
    name: build (React Native library + example app, Android)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib
          key: rn-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache cargo-ndk
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-v4

      - name: Install cargo-ndk
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-ndk

      - name: Scaffold the React Native library
        run: node bindings/react-native/scaffold.mjs

      # The library is generated, so there is no lockfile yet; yarn refuses to
      # create one on CI unless told otherwise.
      - name: Install its dependencies
        working-directory: client-lib/bindings/react-native/library
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: |
          corepack enable
          yarn install

      - name: Build the Rust for Android and generate the bindings
        working-directory: client-lib/bindings/react-native/library
        run: yarn ubrn:android

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trafficnetwork-react-native-generated
          path: |
            client-lib/bindings/react-native/library/src
            client-lib/bindings/react-native/library/cpp
            client-lib/bindings/react-native/library/android/CMakeLists.txt
            client-lib/bindings/react-native/library/android/src/main/java
          retention-days: 14

      # `yarn prepare` is react-native-builder-bob: React Native's own codegen
      # (the native module spec the generated Kotlin extends), the JavaScript
      # build of the library, and its type declarations — what a library ships.
      - name: Build the library
        working-directory: client-lib/bindings/react-native/library
        run: yarn prepare

      - name: Type-check the library
        working-directory: client-lib/bindings/react-native/library
        run: yarn typecheck

      - name: Build the example app
        working-directory: client-lib/bindings/react-native/library/example/android
        run: ./gradlew assembleDebug --no-daemon --console=plain -PreactNativeArchitectures=arm64-v8a

  # What flutter-android cannot show: the app *running*. The same freshly
  # created Flutter app, with an integration test added, on an Android
  # emulator (x86_64, hardware-accelerated) — the library loads from the APK,
  # a client syncs against the scripted server running on the host
  # (10.0.2.2 is the emulator's name for it), and a secret store implemented in
  # Dart is called by the library. The first place anything of this library
  # executes on Android.
  flutter-android-emulator:
    name: run (Flutter app on an Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib/bindings/dart/rust
          key: flutter-android-emulator

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache cargo-ndk
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-v4

      - name: Install cargo-ndk
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-ndk

      # Only the emulator's own ABI: this job is about running, not packaging.
      - name: Build the native library into the plugin (x86_64 only)
        working-directory: client-lib/bindings/dart/rust
        run: |
          rm -rf ../../flutter/android/src/main/jniLibs
          cargo ndk -t x86_64 -o ../../flutter/android/src/main/jniLibs build --release

      - name: Start the scripted server
        run: |
          node conformance/mock-server.mjs --port 18997 > mock.log 2>&1 &
          for i in $(seq 1 50); do
            curl -sf -X POST http://127.0.0.1:18997/__instances -d '{}' > /dev/null && break
            sleep 0.2
          done

      - name: Create the app and add the test
        run: |
          URL=$(curl -sf -X POST http://127.0.0.1:18997/__instances -d '{}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).url))")
          echo "TN_NODE=${URL/127.0.0.1/10.0.2.2}" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP"
          flutter create --platforms=android --project-name trafficnetwork_example_app app
          cd app
          flutter pub add path_provider
          flutter pub add trafficnetwork_flutter --path "$GITHUB_WORKSPACE/client-lib/bindings/flutter"
          flutter pub add dev:integration_test --sdk flutter
          mkdir integration_test
          cp "$GITHUB_WORKSPACE/client-lib/bindings/flutter/example/integration_test/app_test.dart" integration_test/
          rm -f test/widget_test.dart
          # The scripted server speaks plain http; Android refuses that by default.
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: ${{ runner.temp }}/app
          script: flutter test integration_test --dart-define=TN_NODE=${{ env.TN_NODE }}

      - name: Scripted server log
        if: failure()
        run: cat mock.log

  # The same on iOS, on a macOS runner: the Rust for the iOS targets as an
  # XCFramework, the bindings, `pod install`, and the example app built for the
  # simulator. Builds only: the app is not run.
  react-native-ios:
    name: build (React Native library + example app, iOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib
          key: rn-ios

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scaffold the React Native library
        run: node bindings/react-native/scaffold.mjs

      - name: Install its dependencies
        working-directory: client-lib/bindings/react-native/library
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
        run: |
          corepack enable
          yarn install

      - name: Build the Rust for iOS and generate the bindings
        working-directory: client-lib/bindings/react-native/library
        run: yarn ubrn:ios

      - name: Build the library
        working-directory: client-lib/bindings/react-native/library
        run: yarn prepare

      # After the codegen: the pods list the files it wrote.
      - name: Install the pods
        working-directory: client-lib/bindings/react-native/library
        run: yarn ubrn:pods

      - name: Build the example app for the simulator
        working-directory: client-lib/bindings/react-native/library/example/ios
        run: |
          workspace=$(ls -d *.xcworkspace | head -1)
          scheme="${workspace%.xcworkspace}"
          xcodebuild build -workspace "$workspace" -scheme "$scheme" -configuration Debug             -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'             -derivedDataPath build CODE_SIGNING_ALLOWED=NO

  # Add-on B3: the hand-written .d.ts files of both JS bindings, compiled
  # against a typed usage file (never run) — a declaration that drifts from
  # what the integration guides tell a host app to write stops compiling.
  typescript-types:
    name: typescript types (both JS bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install TypeScript
        working-directory: client-lib/bindings/types-test
        run: npm ci

      - name: Compile the typed usage
        working-directory: client-lib/bindings/types-test
        run: npx tsc -p tsconfig.json

  # Add-on B2: TrafficNetworkClient against real server processes (real
  # Postgres via Testcontainers, real federation), controlled through
  # server/tests/support/multi-node-harness.ts's admin API — see
  # client-lib/core/tests/multi_node.rs's module doc. Docker is already
  # available on this runner without extra setup, same as server-ci.yml's
  # own integration-test job.
  multi-node:
    name: multi-node integration tests (real servers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Start the multi-node harness
        working-directory: server
        run: |
          npm run test:support:multi-node > multi-node-harness.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4100/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4100/health

      - name: Run the multi-node integration tests
        run: cargo test -p trafficnetwork-core --test multi_node -- --test-threads=1

      - name: Multi-node harness log
        if: always()
        working-directory: server
        run: cat multi-node-harness.log

  # One line that says whether every binding passed the same scenario set:
  # the C ABI (through Python on three operating systems, and through Node.js),
  # WebAssembly, and the three mobile bindings. Each of those jobs runs
  # conformance/scenarios.json with the same expectations; this job only
  # collects their verdicts, so "same behavior everywhere" has one status to
  # point at.
  conformance:
    name: conformance (every binding, same scenarios)
    needs:
      - conformance-python
      - conformance-node
      - conformance-web
      - conformance-kotlin
      - swift-package
      - dart-package
    if: always()
    runs-on: ubuntu-latest
    # No checkout here, so no client-lib/ directory to run in.
    defaults:
      run:
        working-directory: .
    steps:
      - name: Collect the verdicts
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | node -e "
            const needs = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const names = {
              'conformance-python': 'C ABI via Python (Linux, macOS, Windows)',
              'conformance-node': 'C ABI via Node.js',
              'conformance-web': 'WebAssembly in headless Chrome',
              'conformance-kotlin': 'Kotlin (UniFFI) on the JVM',
              'swift-package': 'Swift (UniFFI) on macOS',
              'dart-package': 'Dart (flutter_rust_bridge) on the Dart VM',
            };
            let failed = 0;
            let table = '| Binding | Result |\n|---|---|\n';
            for (const [job, label] of Object.entries(names)) {
              const result = needs[job].result;
              if (result !== 'success') failed += 1;
              table += '| ' + label + ' | ' + result + ' |\n';
            }
            console.log(table);
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, table);
            process.exit(failed ? 1 : 0);
          "
