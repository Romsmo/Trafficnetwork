name: ingestion-ci

on:
  push:
    branches: [main, "phase3/**"]
    paths:
      - "ingestion/**"
      - "server/**"
      - ".github/workflows/ingestion-ci.yml"
  pull_request:
    paths:
      - "ingestion/**"
      - "server/**"
      - ".github/workflows/ingestion-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    # A services: container (not Testcontainers-in-Node): CI has Postgres/PostGIS ready and the tests only need
    # a superuser URL to create one database per test file on it.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trafficnetwork
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ingestion/package-lock.json

      - name: Install osmium-tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Install ingestion dependencies
        working-directory: ingestion
        run: npm ci

      - name: Lint
        working-directory: ingestion
        run: npm run lint

      - name: Typecheck
        working-directory: ingestion
        run: npm run typecheck

      - name: Unit tests
        working-directory: ingestion
        run: npm run test:unit

      - name: Build server
        working-directory: server
        run: |
          npm ci
          npm run build

      # Each integration test file creates its own database on the postgres service above (tests/integration/setup.ts),
      # migrates it, starts server/dist against it and mints a bulk-import client: the importer refuses a fresh start on a
      # server that already holds static data, and several files import static data, so files must not share one database.
      - name: Integration tests
        working-directory: ingestion
        env:
          INGESTION_TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm run test:integration
