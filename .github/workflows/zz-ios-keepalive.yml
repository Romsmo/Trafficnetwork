name: zz-ios-keepalive (temporary experiment)
on:
  push:
    paths:
      - ".github/workflows/zz-ios-keepalive.yml"
jobs:
  experiment:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-lib/bindings/dart/rust
          key: zz-keepalive
      - name: Build the static library for this Mac
        working-directory: client-lib/bindings/dart/rust
        run: cargo build --release
      - name: Which C symbols does the archive export
        working-directory: client-lib/bindings/dart/rust
        run: |
          LIB=target/release/libtrafficnetwork_dart.a
          nm -gU "$LIB" 2>/dev/null | awk '$2=="T"{print $3}' | sed 's/^_//' | sort -u > "$RUNNER_TEMP/exported.txt"
          wc -l "$RUNNER_TEMP/exported.txt"
          grep -v -E '^(frb|frbgen|store_dart|dart_fn|free_wire|init_frb)' "$RUNNER_TEMP/exported.txt" | head -40 || true
          echo "--- those Dart/FRB look up:"
          grep -E '^(frb|frbgen|store_dart|dart_fn|free_wire|init_frb)' "$RUNNER_TEMP/exported.txt"
      - name: Link a host with different flags and look the functions up by name
        working-directory: client-lib/bindings/dart/rust
        run: |
          LIB="$PWD/target/release/libtrafficnetwork_dart.a"
          grep -E '^(frb|frbgen|store_dart|dart_fn|free_wire|init_frb)' "$RUNNER_TEMP/exported.txt" > "$RUNNER_TEMP/wanted.txt"
          cat > "$RUNNER_TEMP/host.c" <<'EOC'
          #include <dlfcn.h>
          #include <stdio.h>
          #include <string.h>
          int main(int argc, char **argv) {
            FILE *f = fopen(argv[1], "r"); char name[1024]; int found = 0, total = 0;
            while (f && fgets(name, sizeof name, f)) { name[strcspn(name, "\n")] = 0; if (!*name) continue; total++; if (dlsym(RTLD_DEFAULT, name)) found++; }
            printf("%d of %d found\n", found, total); return found == total ? 0 : 1;
          }
          EOC
          cd "$RUNNER_TEMP"
          UFLAGS=$(sed 's/^/-Wl,-u,_/' wanted.txt | tr '\n' ' ')
          run() { # run "<name>" <post-link command or ''> <cc flags...>
            local name="$1" post="$2"; shift 2
            rm -f host
            if ! cc host.c "$@" -o host -lc++ -framework Security -framework CoreFoundation -framework SystemConfiguration -liconv -lresolv 2>link.log; then echo "[$name] LINK FAILED: $(tail -3 link.log)"; return; fi
            [ -n "$post" ] && eval "$post host"
            ./host wanted.txt | sed "s/^/[$name] /" || true
          }
          run "no flags"                         ""           "$LIB"
          run "force_load"                       ""           -Wl,-force_load,"$LIB"
          run "force_load + dead_strip"          ""           -Wl,-force_load,"$LIB" -Wl,-dead_strip
          run "force_load + dead_strip + strip -x"   "strip -x"   -Wl,-force_load,"$LIB" -Wl,-dead_strip
          run "force_load + dead_strip + strip -u -r" "strip -u -r" -Wl,-force_load,"$LIB" -Wl,-dead_strip
          run "force_load + dead_strip + strip (all)" "strip"     -Wl,-force_load,"$LIB" -Wl,-dead_strip
          run "-u list + dead_strip"             ""           "$LIB" $UFLAGS -Wl,-dead_strip
          run "-u list + dead_strip + strip -x"  "strip -x"   "$LIB" $UFLAGS -Wl,-dead_strip
          run "-u list + dead_strip + strip -u -r" "strip -u -r" "$LIB" $UFLAGS -Wl,-dead_strip
          run "-u list, no dead_strip"           ""           "$LIB" $UFLAGS
          run "all_load + dead_strip"            ""           -Wl,-all_load "$LIB" -Wl,-dead_strip
          run "force_load + dead_strip + export_dynamic + strip -u -r" "strip -u -r" -Wl,-force_load,"$LIB" -Wl,-dead_strip -Wl,-export_dynamic
